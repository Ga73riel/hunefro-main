<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Redirecionamento automático via meta tag HTTP-EQUIV (0 segundos de espera) -->
  <meta http-equiv="refresh" content="0; url=login.html">
  <title>Hu-Nefro — Redirecionando...</title>

  <!-- Script de fallback para redirecionar via JavaScript -->
  <script>
    window.location.href = "frontend/login.html";
  </script>
</head>
<body>
  <!-- Fallback simples para o caso de JavaScript e redirecionamento de meta tag estarem desabilitados -->
  <p>Caso não seja redirecionado automaticamente, <a href="login.html">clique aqui para acessar a página de login</a>.</p>
</body>
</html>
